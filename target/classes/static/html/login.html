<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in - SkillSwap</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="site-header"></div>

<main>
  <div class="card" style="max-width:420px;margin:30px auto;">
    <h2>Log in to SkillSwap</h2>
    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="loginEmail" required>
      <label>Password</label>
      <input type="password" id="loginPassword" required>
      <button class="btn" type="submit" style="width:100%;">Log in</button>
      <div class="error-text hidden" id="loginError"></div>
    </form>
    <p class="switch-line">No account? <a href="register.html">Register here</a></p>
    <p class="small-text muted" style="margin-top:10px;">Demo logins: <strong>priya@skillswap.com</strong> / <strong>password123</strong> (user), or <strong>admin@skillswap.com</strong> / <strong>admin123</strong> (admin).</p>
  </div>
</main>

<footer>SkillSwap - A Community-Based Peer-to-Peer Skill Exchange Platform</footer>

<script src="../js/backend.js"></script>
<script src="../js/common.js"></script>
<script src="../js/login.js"></script>
</body>
</html>

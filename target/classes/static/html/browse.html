<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse - SkillSwap</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="site-header"></div>

<main>
  <div class="fb-layout">

    <aside class="fb-left">
      <div class="card profile-mini" id="myProfileMini"></div>
      <div class="card fb-shortcuts" id="accountShortcuts">
        <h4>Shortcuts</h4>
        <a class="fb-shortcut-btn" href="matches.html">💬 My Matches</a>
        <a class="fb-shortcut-btn" href="profile.html">✏️ Edit My Profile</a>
        <a class="fb-shortcut-btn" href="leaderboard.html">🏆 Leaderboard</a>
        <a class="fb-shortcut-btn" href="rewards.html">🎁 Rewards</a>
      </div>
      <div class="card fb-shortcuts">
        <h4>Filter feed</h4>
        <label>Reviews</label>
        <select id="reviewsBucketFilter">
          <option value="">Any</option>
          <option value="under10">Under 10 reviews</option>
          <option value="under100">Under 100 reviews</option>
          <option value="under1000">Under 1000 reviews</option>
        </select>
        <label>Min. students taught</label>
        <input type="number" min="0" id="minEnrollmentsFilter" placeholder="e.g. 5">
        <label class="checkbox-inline top-gap">
          <input type="checkbox" id="hasFeedbackFilter"> Has written feedback
        </label>
      </div>
    </aside>

    <div class="fb-middle">
      <div class="card composer">
        <img class="avatar" id="composerAvatar" src="" alt="">
        <input type="text" id="browseSearch" placeholder="Search for a skill you want to learn...">
      </div>

      <div id="suggestionsStrip"></div>

      <h3 class="feed-heading">Skill sharers in the community</h3>
      <div id="browseGrid" class="fb-feed-grid"></div>
    </div>

    <aside class="fb-right">
      <div class="card">
        <h4>People with similar interests</h4>
        <div id="similarList"></div>
      </div>
    </aside>

  </div>
</main>

<footer>SkillSwap - A Community-Based Peer-to-Peer Skill Exchange Platform</footer>

<script src="../js/backend.js"></script>
<script src="../js/common.js"></script>
<script src="../js/browse.js"></script>
</body>
</html>

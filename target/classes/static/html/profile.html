<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile - SkillSwap</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="site-header"></div>

<main>
  <h1>My Profile</h1>
  <div id="welcomeBanner" class="card hidden" style="background:var(--primary-tint);border-color:var(--primary-light);">
    🎉 Welcome to SkillSwap! You've already earned points for signing up. Add your skills and a photo below to earn more.
  </div>

  <div class="card">
    <img id="profileAvatar" class="avatar" src="" alt="avatar">
    <input type="file" id="imageInput" accept="image/*" class="file-input">
    <button class="btn small" id="uploadImageBtn">Upload photo</button>
    <p id="verifiedNote" class="small-text top-gap"></p>
  </div>

  <div class="card">
    <h3>Skills I can teach</h3>
    <input type="text" id="offeredInput" placeholder="Type a skill and press Enter" list="skillCatalogList">
    <div id="offeredTags" class="top-gap"></div>

    <h3 class="section-title">Skills I want to learn</h3>
    <input type="text" id="wantedInput" placeholder="Type a skill and press Enter" list="skillCatalogList">
    <div id="wantedTags" class="top-gap"></div>
    <datalist id="skillCatalogList"></datalist>

    <button class="btn" id="saveSkillsBtn">Save skills</button>
    <div id="skillsMsg" class="small-text"></div>
  </div>
</main>

<footer>SkillSwap - A Community-Based Peer-to-Peer Skill Exchange Platform</footer>

<script src="../js/backend.js"></script>
<script src="../js/common.js"></script>
<script src="../js/profile.js"></script>
</body>
</html>

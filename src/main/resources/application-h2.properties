# Zero-config demo profile: an in-memory H2 database instead of MySQL.
# Run with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
# Or in IntelliJ: Run Configuration -> Active profiles: h2
#
# Use this ONLY as a safety net if MySQL isn't available/working on defense
# day - your actual assignment requires MySQL (see application.properties).
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:skillswap;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Optional: browse the in-memory DB at http://localhost:9090/h2-console
# (JDBC URL: jdbc:h2:mem:skillswap, user: sa, blank password)
spring.h2.console.enabled=true

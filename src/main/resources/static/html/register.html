<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up - SkillSwap</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="site-header"></div>

<main>
  <div class="card" style="max-width:420px;margin:30px auto;">
    <h2>Create your SkillSwap account</h2>
    <p class="small-text muted">You'll earn 20 points just for signing up 🎉</p>
    <form id="registerForm">
      <label>Full name</label>
      <input type="text" id="regName" required>
      <label>Email</label>
      <input type="email" id="regEmail" required>
      <label>Password (min 8 characters)</label>
      <input type="password" id="regPassword" required minlength="8">
      <label>City</label>
      <input type="text" id="regCity" placeholder="e.g. Kathmandu">
      <button class="btn" type="submit" style="width:100%;">Create account</button>
      <div class="error-text hidden" id="regError"></div>
    </form>
    <p class="switch-line">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</main>

<footer>SkillSwap - A Community-Based Peer-to-Peer Skill Exchange Platform</footer>

<script src="../js/backend.js"></script>
<script src="../js/common.js"></script>
<script src="../js/register.js"></script>
</body>
</html>
